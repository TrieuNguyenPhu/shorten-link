AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Incremental infrastructure for npt-shortenlink.dev.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedPattern: "^[a-z][a-z0-9-]{1,15}$"
    Description: Short environment suffix used in physical resource names.

  DomainName:
    Type: String
    Default: npt-shortenlink.dev
    AllowedPattern: "^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
    ConstraintDescription: Enter a valid lower-case DNS name.

  CorsAllowedOrigins:
    Type: CommaDelimitedList
    Default: https://npt-shortenlink.dev
    Description: Exact browser origins allowed by the HTTP API and Go application.

  CloudFrontPriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
    Description: CloudFront edge-location price class.

Globals:
  Function:
    Runtime: provided.al2023
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        LINKS_TABLE_NAME: !Ref LinksTable
        PUBLIC_BASE_URL: !Sub "https://${DomainName}"
        STORAGE_DRIVER: dynamodb
        CORS_ALLOWED_ORIGINS: !Join [",", !Ref CorsAllowedOrigins]
    Tags:
      Application: npt-shortenlink
      Environment: !Ref EnvironmentName

Resources:
  LinksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-${EnvironmentName}-links"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
      KeySchema:
        - AttributeName: code
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  ShortenerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-shortener-api"
      RetentionInDays: 30

  ShortenerFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Least-privilege execution role for the URL shortener Lambda.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: WriteLambdaLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ShortenerFunctionLogGroup}:*"
        - PolicyName: ReadWriteLinksByPrimaryKey
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt LinksTable.Arn

  ShortenerHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: HTTP API for link creation, lookup, redirect, and health checks.
      StageName: "$default"
      FailOnWarnings: true
      PropagateTags: true
      CorsConfiguration:
        AllowCredentials: false
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Request-Id
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowOrigins: !Ref CorsAllowedOrigins
        ExposeHeaders:
          - Location
          - X-Request-Id
        MaxAge: 600
      DefinitionBody:
        openapi: "3.0.1"
        info:
          title: !Sub "${AWS::StackName}-http-api"
          version: "1.0"
        paths:
          /api/v1/links:
            post: {}
          /api/v1/links/{code}:
            get:
              parameters:
                - name: code
                  in: path
                  required: true
                  schema:
                    type: string
          /link/{code}:
            get:
              parameters:
                - name: code
                  in: path
                  required: true
                  schema:
                    type: string
          /healthz:
            get: {}
      Tags:
        Application: npt-shortenlink
        Environment: !Ref EnvironmentName

  ShortenerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "${AWS::StackName}-shortener-api"
      Description: Go HTTP API for creating and resolving short links.
      CodeUri: ../../services/shortener-api
      Handler: bootstrap
      Role: !GetAtt ShortenerFunctionRole.Arn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref ShortenerFunctionLogGroup
        SystemLogLevel: INFO
      Events:
        CreateLink:
          Type: HttpApi
          Properties:
            ApiId: !Ref ShortenerHttpApi
            Method: POST
            Path: /api/v1/links
            PayloadFormatVersion: "2.0"
        GetLink:
          Type: HttpApi
          Properties:
            ApiId: !Ref ShortenerHttpApi
            Method: GET
            Path: /api/v1/links/{code}
            PayloadFormatVersion: "2.0"
        RedirectLink:
          Type: HttpApi
          Properties:
            ApiId: !Ref ShortenerHttpApi
            Method: GET
            Path: /link/{code}
            PayloadFormatVersion: "2.0"
        HealthCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref ShortenerHttpApi
            Method: GET
            Path: /healthz
            PayloadFormatVersion: "2.0"

  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: Private S3 access for the shortener frontend.
        Name: !Sub "${AWS::StackName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Static frontend and serverless shortener API.
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt FrontendBucket.RegionalDomainName
            Id: frontend-s3
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - CustomOriginConfig:
              HTTPSPort: 443
              OriginKeepaliveTimeout: 5
              OriginProtocolPolicy: https-only
              OriginReadTimeout: 30
              OriginSSLProtocols:
                - TLSv1.2
            DomainName: !Sub "${ShortenerHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
            Id: shortener-http-api
        CacheBehaviors:
          - AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - OPTIONS
              - PATCH
              - POST
              - PUT
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            Compress: true
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            PathPattern: /api/*
            TargetOriginId: shortener-http-api
            ViewerProtocolPolicy: redirect-to-https
          - AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            Compress: true
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            PathPattern: /link/*
            TargetOriginId: shortener-http-api
            ViewerProtocolPolicy: redirect-to-https
          - AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            Compress: true
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            PathPattern: /healthz
            TargetOriginId: shortener-http-api
            ViewerProtocolPolicy: redirect-to-https
        PriceClass: !Ref CloudFrontPriceClass
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

Outputs:
  LinksTableName:
    Description: DynamoDB table used by the shortener API.
    Value: !Ref LinksTable

  HttpApiId:
    Description: API Gateway HTTP API identifier.
    Value: !Ref ShortenerHttpApi

  HttpApiEndpoint:
    Description: Regional HTTP API endpoint.
    Value: !Sub "https://${ShortenerHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"

  ShortenerFunctionArn:
    Description: Go shortener Lambda ARN.
    Value: !GetAtt ShortenerFunction.Arn

  CloudFrontDistributionId:
    Description: Distribution ID used for cache invalidations.
    Value: !Ref FrontendDistribution

  CloudFrontDomainName:
    Description: CloudFront-generated hostname available before custom-domain wiring.
    Value: !GetAtt FrontendDistribution.DomainName

  FrontendBucketName:
    Description: Private bucket that receives the static export.
    Value: !Ref FrontendBucket
