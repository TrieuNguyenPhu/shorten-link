AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Incremental infrastructure for npt-shortenlink.dev.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedPattern: "^[a-z][a-z0-9-]{1,15}$"
    Description: Short environment suffix used in physical resource names.

Resources:
  LinksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-${EnvironmentName}-links"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
      KeySchema:
        - AttributeName: code
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

Outputs:
  LinksTableName:
    Description: DynamoDB table used by the shortener API.
    Value: !Ref LinksTable
