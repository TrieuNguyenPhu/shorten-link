name: Deploy dev

on:
  workflow_dispatch:
    inputs:
      action:
        description: Produce a saved plan, or apply a reviewed plan
        type: choice
        options: [plan, apply]
        default: plan
        required: true
      plan_run_id:
        description: Reviewed plan workflow run ID (required for apply at the same main commit)
        type: string
        default: ''

permissions:
  contents: read

# All releases share one writer, including plan, Terraform, CodeDeploy and S3.
concurrency:
  group: url-shortener-dev-deployment
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.repository == 'TrieuNguyenPhu/shorten-link'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_runtime_boundary_arn: ${{ vars.RUNTIME_BOUNDARY_ARN }}
      TF_VAR_moderation_boundary_arn: ${{ vars.MODERATION_BOUNDARY_ARN }}
      TF_VAR_cognito_domain_prefix: ${{ vars.COGNITO_DOMAIN_PREFIX }}
      TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TF_VAR_callback_urls: ${{ vars.CALLBACK_URLS || '[]' }}
      TF_VAR_logout_urls: ${{ vars.LOGOUT_URLS || '[]' }}
      TF_VAR_cors_origins: ${{ vars.CORS_ORIGINS || '[]' }}
      TF_VAR_alarm_email_addresses: ${{ vars.ALARM_EMAIL_ADDRESSES || '[]' }}
      TF_VAR_log_retention_days: ${{ vars.LOG_RETENTION_DAYS || '365' }}
      NEXT_TELEMETRY_DISABLED: '1'
      TF_IN_AUTOMATION: 'true'
      RELEASE_ACTION: ${{ inputs.action }}
      PLAN_RUN_ID: ${{ inputs.plan_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate required deployment setup
        shell: bash
        env:
          DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          test -f infrastructure/terraform/modules/codedeploy_canary/main.tf
          for name in AWS_ACCOUNT_ID TF_STATE_BUCKET TF_VAR_runtime_boundary_arn TF_VAR_moderation_boundary_arn TF_VAR_cognito_domain_prefix TF_VAR_google_client_id TF_VAR_google_client_secret DEPLOY_ROLE; do
            test -n "${!name}" || { printf 'Missing environment configuration: %s\n' "$name" >&2; exit 1; }
          done
          if [[ $RELEASE_ACTION == apply ]]; then [[ $PLAN_RUN_ID =~ ^[1-9][0-9]*$ ]]; fi
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.13.0'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.33.2
      - name: Verify source and build all eight archives
        run: make check
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: url-shortener-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Plan or apply reviewed saved plan
        shell: bash
        run: |
          set -euo pipefail
          if [[ $RELEASE_ACTION == plan ]]; then
            bash scripts/deploy-app.sh plan "$GITHUB_RUN_ID"
          else
            bash scripts/deploy-app.sh apply "$PLAN_RUN_ID"
          fi
