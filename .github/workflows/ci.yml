name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l backend)"
      - name: Test with race detector
        run: go -C backend test -race ./...
      - name: Vet
        run: go -C backend vet ./...
      - name: Check reachable vulnerabilities
        run: go -C backend run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  packaging-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Verify Windows packaging and PowerShell entrypoint
        run: go -C backend test ./tools/build-lambdas
