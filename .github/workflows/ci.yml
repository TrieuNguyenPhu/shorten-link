name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.0@sha256:d89f8fcc6b1a39cb35976c248ed42a28c66ae00dc043099210f5571e42648ab4
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l backend)"
      - name: Test with race detector
        run: go -C backend test -race ./...
      - name: Vet
        run: go -C backend vet ./...
      - name: DynamoDB Local integration and HTTP E2E
        env:
          DYNAMODB_ENDPOINT: http://127.0.0.1:8000
        run: go -C backend test -race -tags=integration -count=1 ./internal/repository/... ./tools/local-http/...
      - name: Build HTTP Lambda arm64 archives
        run: bash scripts/build-lambdas.sh
      - name: Check reachable vulnerabilities
        run: go -C backend run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  packaging-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Verify Windows packaging and PowerShell entrypoint
        run: go -C backend test ./tools/build-lambdas
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.33.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build static export
        run: pnpm build
      - name: Verify exported HTML and assets
        run: pnpm test
      - name: Audit production dependencies
        run: pnpm audit --prod
