name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend
        run: pnpm test:web

      - name: Lint frontend
        run: pnpm lint:web

      - name: Build frontend
        run: pnpm build:web

  backend:
    name: Backend format, test, and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.9
          cache-dependency-path: services/shortener-api/go.sum

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l services/shortener-api)"
          if [[ -n "$unformatted" ]]; then
            printf 'The following Go files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet backend
        run: go vet ./services/shortener-api/...

      - name: Test backend with race detector
        run: go test -race -count=1 ./services/shortener-api/...

      - name: Scan backend dependencies
        run: go -C services/shortener-api run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  infrastructure:
    name: Validate and build AWS infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend
    env:
      GOOS: linux
      GOARCH: arm64
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.9
          cache-dependency-path: services/shortener-api/go.sum

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.5

      - name: Build Lambda artifact
        run: |
          mkdir -p infra/aws/.build
          go build -trimpath -ldflags='-s -w' -o infra/aws/.build/bootstrap ./services/shortener-api/cmd/api

      - name: Validate Terraform
        run: |
          terraform -chdir=infra/aws init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/aws fmt -check -recursive
          terraform -chdir=infra/aws validate
          terraform -chdir=infra/aws test

      - name: Test deployment guards
        run: node --test scripts/deploy-aws.test.mjs

  dependency-audit:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.20.0

      - name: Audit lockfile
        run: pnpm audit:deps

  api-contract:
    name: Lint OpenAPI contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.20.0

      - name: Lint OpenAPI specification
        run: pnpm --package=@redocly/cli@2.40.0 dlx redocly lint openapi/openapi.yaml
