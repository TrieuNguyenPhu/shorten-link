name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.0@sha256:d89f8fcc6b1a39cb35976c248ed42a28c66ae00dc043099210f5571e42648ab4
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l backend)"
      - name: Test with race detector
        run: go -C backend test -race ./...
      - name: Vet
        run: go -C backend vet ./...
      - name: DynamoDB Local transactions, HTTP analytics and WebSocket E2E
        env:
          DYNAMODB_ENDPOINT: http://127.0.0.1:8000
        run: go -C backend test -race -tags=integration -count=1 ./internal/repository/... ./tools/local-http/...
      - name: Build all eight Lambda arm64 archives
        shell: bash
        run: |
          go -C backend run ./tools/build-lambdas
          for handler in create-link resolve-link list-links delete-link click-aggregator ws-connect ws-disconnect moderate-check; do
            test -s "backend/dist/$handler.zip"
          done
      - name: Check reachable vulnerabilities
        run: go -C backend run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.13.0'
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.33.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build static export
        run: pnpm build
      - name: Verify exported HTML and assets
        run: pnpm test
      - name: Audit production dependencies
        run: pnpm audit --prod

  terraform:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: backend/go.sum
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false
      - name: Build real Lambda packages for Terraform hash inputs
        run: go -C backend run ./tools/build-lambdas
      - name: Test CloudFront viewer-request rewrites
        run: node --test infrastructure/terraform/modules/frontend_hosting/tests/url-rewrite.test.mjs
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infrastructure/terraform
      - name: Validate and test bootstrap and dev without AWS
        shell: bash
        run: |
          for root in infrastructure/terraform/bootstrap infrastructure/terraform/environments/dev; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate -no-color
            terraform -chdir="$root" test -no-color
          done

  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Validate workflow definitions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -shellcheck= .github/workflows/ci.yml .github/workflows/deploy.yml
      - name: Validate deployment scripts and exercise release failure paths
        run: |
          bash -n scripts/deploy-canary.sh scripts/deploy-app.sh scripts/publish-frontend.sh tests/e2e/canary.sh
          python3 -m unittest discover -s scripts/tests -v
          node --test tests/load/redirect.test.mjs
