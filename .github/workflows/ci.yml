name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache-dependency-path: services/lambda/go.sum
      - name: Go static checks
        run: |
          test -z "$(gofmt -l services/lambda)"
          go -C services/lambda vet ./...
          go -C services/lambda run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: DynamoDB Local
        run: |
          docker compose -f local/compose.yaml up -d
          go -C services/lambda run ./cmd/initdb
      - name: Go unit, contract and DynamoDB integration tests
        run: go -C services/lambda test -race ./... -count=1
        env:
          DYNAMODB_INTEGRATION: "1"
      - name: Stop local database
        if: always()
        run: docker compose -f local/compose.yaml down